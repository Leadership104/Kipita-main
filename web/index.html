<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Find your current location and explore places with Kipita and Google Maps.">
  <meta name="theme-color" content="#de2c42">
  <title>Kipita</title>
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="avatar" aria-hidden="true">G</span> Hi, Guest</div>
    <a href="#location" class="change-location" id="change-location">Change Location</a>
  </header>
  <div class="location-bar" id="active-location">Choose a location</div>
  <main class="workspace" id="content">
    <section class="catalog" aria-labelledby="section-title">
      <h1 id="section-title">Places</h1>
      <div class="categories" id="categories" aria-label="Place categories">
        <button type="button" data-category="restaurant" aria-pressed="true">Restaurants</button>
        <button type="button" data-category="entertainment" aria-pressed="false">Entertainment</button>
        <button type="button" data-category="shopping" aria-pressed="false">Shopping</button>
      </div>
      <p id="catalog-status" role="status"></p>
      <div class="catalog-list" id="catalog-list"></div>
      <button id="retry-catalog" type="button" hidden>Try again</button>
    </section>
    <section class="panel" aria-labelledby="title" id="location">
      <h2 id="title">Change Location</h2>
      <form id="search-form">
        <label for="place">Place or address</label>
        <div class="search-row">
          <input id="place" type="search" required maxlength="300" placeholder="City, landmark, or address">
          <button class="search-button" type="submit">Search</button>
        </div>
      </form>
      <button class="locate-button" id="locate" type="button">
        <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="7"/><circle cx="12" cy="12" r="2.5"/><path d="M12 2v3m0 14v3M2 12h3m14 0h3"/></svg>
        <span id="locate-label">Use my location</span>
      </button>
      <p id="status" role="status" aria-live="polite"></p>
    </section>
    <section class="map-panel" aria-label="Map">
      <div class="map-toolbar">
        <div class="map-title">
          <span class="map-provider">Google Maps</span>
          <strong id="map-label">World map</strong>
        </div>
        <a id="map-link" href="https://www.google.com/maps/" target="_blank" rel="noopener noreferrer">Open Google Maps</a>
      </div>
      <iframe id="map" title="Google Maps world view" referrerpolicy="no-referrer" allowfullscreen src="https://www.google.com/maps?q=World&amp;z=2&amp;output=embed"></iframe>
    </section>
  </main>
  <nav class="bottom-nav" aria-label="Kipita sections">
    <a href="#places" data-section="places" aria-current="page"><span aria-hidden="true">⌖</span>Places</a>
    <a href="#advisory" data-section="advisory"><span aria-hidden="true">ⓘ</span>Advisory</a>
    <a href="#travel" data-section="travel"><span aria-hidden="true">✈</span>Travel</a>
    <a href="#perks" data-section="perks"><span aria-hidden="true">☆</span>Perks</a>
  </nav>
</body>
</html>
