<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Find your current location and explore places with Kipita and Google Maps.">
  <meta name="theme-color" content="#102c34">
  <title>Kipita | Location finder</title>
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none"><path d="M20 10c0 5-8 11-8 11S4 15 4 10a8 8 0 1 1 16 0Z" stroke="currentColor" stroke-width="1.7"/><circle cx="12" cy="10" r="2.6" fill="currentColor"/></svg></span>
      Kipita
    </div>
  </header>
  <main class="workspace">
    <section class="panel" aria-labelledby="title">
      <h1 id="title">Find a location</h1>
      <p class="intro">Search for a place or find where you are on Google Maps.</p>
      <form id="search-form">
        <label for="place">Place or address</label>
        <div class="search-row">
          <input id="place" type="search" required maxlength="300" placeholder="City, landmark, or address">
          <button class="search-button" type="submit">Search</button>
        </div>
      </form>
      <button class="locate-button" id="locate" type="button">
        <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="7"/><circle cx="12" cy="12" r="2.5"/><path d="M12 2v3m0 14v3M2 12h3m14 0h3"/></svg>
        <span id="locate-label">Use my location</span>
      </button>
      <p id="status" role="status" aria-live="polite"></p>
    </section>
    <section class="map-panel" aria-label="Map">
      <div class="map-toolbar">
        <div class="map-title">
          <span class="map-provider">Google Maps</span>
          <strong id="map-label">World map</strong>
        </div>
        <a id="map-link" href="https://www.google.com/maps/" target="_blank" rel="noopener noreferrer">Open Google Maps</a>
      </div>
      <iframe id="map" title="Google Maps world view" referrerpolicy="no-referrer" allowfullscreen src="https://www.google.com/maps?q=World&amp;z=2&amp;output=embed"></iframe>
    </section>
  </main>
</body>
</html>
