plugins {
    id 'com.android.application'
    id 'kotlin-android'
    id 'kotlin-kapt'
    id 'kotlinx-serialization'
    id 'kotlin-parcelize'
    id 'com.google.gms.google-services'
    id 'com.google.firebase.crashlytics'
}

repositories {
    maven { url "https://jitpack.io" }
    mavenCentral()
    gradlePluginPortal()
    maven { url 'https://oss.sonatype.org/content/repositories/snapshots/' }
}

android {
    namespace 'com.mytum'
    compileSdk 35

    defaultConfig {
        applicationId "com.mytum"
        minSdk 21         // UPDATED → required for Android 16
        targetSdk 35       // SAFEST for Android 16
        versionCode 35
        versionName "1.0.28"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildFeatures {
        dataBinding = true
        viewBinding = true
    }

    packagingOptions {
        exclude 'project.properties'
        exclude 'META-INF/INDEX.LIST'
        exclude 'META-INF/DEPENDENCIES'
        exclude 'META-INF/LICENSE'
        exclude 'META-INF/LICENSE.txt'
        exclude 'META-INF/license.txt'
        exclude 'META-INF/NOTICE'
        exclude 'META-INF/NOTICE.txt'
        exclude 'META-INF/notice.txt'
        exclude 'META-INF/ASL2.0'
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_17.toString()
    }
}

dependencies {

    implementation fileTree(dir: 'libs', include: ['*.jar'])

    // UI
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.0'   // UPDATED

    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.fragment:fragment-ktx:1.8.1'

    // Removed OLD support libs:
    // - legacy-support-v4
    // - android.support.constraint
    // - android.support.test libraries

    // Glide
    implementation 'com.github.bumptech.glide:glide:4.12.0'
    implementation 'com.github.bumptech.glide:compiler:4.12.0'

    // Retrofit + OkHttp (safe)
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'
    implementation 'org.apache.httpcomponents:httpclient:4.5.14'
    implementation 'com.kyleduo.switchbutton:library:2.1.0'
    implementation 'com.github.zcweng:switch-button:0.0.3'

    // Jackson (updated, safe)
    implementation 'com.fasterxml.jackson.core:jackson-core:2.13.5'
    implementation 'com.fasterxml.jackson.core:jackson-annotations:2.13.5'
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.13.5'
    implementation 'com.squareup.retrofit2:converter-jackson:2.9.0'

    // RX Android (safe)
    implementation 'io.reactivex.rxjava2:rxandroid:2.1.1'

    // Others
    implementation "com.mikepenz:materialdrawer:8.4.2"
    implementation 'com.github.chivorns:smartmaterialspinner:2.0.0'
    implementation "androidx.datastore:datastore-preferences:1.1.1"
    implementation 'jp.wasabeef:glide-transformations:4.3.0'
    implementation 'jp.co.cyberagent.android:gpuimage:2.1.0'
    implementation "com.ncorti:slidetoact:0.9.0"
    implementation 'com.squareup.picasso:picasso:2.71828'
    implementation 'com.facebook.fresco:fresco:3.1.3'
    implementation 'com.wdullaer:materialdatetimepicker:4.2.3'
    implementation 'com.facebook.android:facebook-android-sdk:17.0.0'
    implementation 'com.jpardogo.materialtabstrip:library:1.1.1'
    implementation 'com.github.ybq:Android-SpinKit:1.4.0'
    implementation 'de.hdodenhof:circleimageview:3.1.0'
    implementation 'com.github.ertugrulkaragoz:SuperBottomBar:0.4'
    implementation 'com.google.android.libraries.places:places:3.5.0'
    implementation 'com.airbnb.android:lottie:4.2.2'
    implementation 'com.google.android.flexbox:flexbox:3.0.0'
    implementation 'com.jaredrummler:material-spinner:1.3.1'

    // Navigation
    implementation("androidx.navigation:navigation-fragment-ktx:2.7.7")
    implementation("androidx.navigation:navigation-ui-ktx:2.7.7")
    implementation("androidx.navigation:navigation-dynamic-features-fragment:2.7.7")

    // Rating
//    implementation 'com.github.ome450901:SimpleRatingBar:1.5.1'
    implementation 'com.github.fuzz-productions:RatingBar:1.0.2'
    implementation 'com.github.mancj:MaterialSearchBar:0.8.2'
    implementation("io.coil-kt:coil:1.4.0")
    implementation 'com.github.yalantis:ucrop:2.2.8'
    implementation 'com.github.Sirelon:SimpleRatingBar:1.3'
//    implementation 'com.willy.ratingbar:ratingbar:1.1.2'
    implementation 'com.github.willyratingbar:ratingbar:1.1.2'


    // Google Play Services
    implementation 'com.google.android.gms:play-services-auth:21.4.0'
    implementation 'com.google.android.gms:play-services-location:21.3.0'
    implementation 'com.google.android.gms:play-services-maps:19.2.0'
    implementation 'com.google.maps.android:android-maps-utils:2.2.0'

    // Work Manager + Lifecycle
    implementation("androidx.work:work-runtime-ktx:2.9.1")
    implementation("androidx.lifecycle:lifecycle-runtime-ktx:2.8.6")
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
//    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'

    // Firebase
    implementation platform("com.google.firebase:firebase-bom:32.0.0")
    implementation 'com.google.firebase:firebase-analytics'
    implementation 'com.google.firebase:firebase-crashlytics'
    implementation 'com.google.firebase:firebase-auth:22.0.0'
    implementation 'com.google.firebase:firebase-messaging-directboot:23.1.2'
    implementation 'com.google.firebase:firebase-installations:18.0.0'
    implementation 'com.google.firebase:firebase-inappmessaging-display'

    implementation 'io.supercharge:shimmerlayout:2.1.0'
    implementation 'me.zhanghai.android.materialratingbar:library:1.4.0'
    implementation 'com.facebook.shimmer:shimmer:0.5.0'

    // Utils
    implementation 'org.conscrypt:conscrypt-android:2.2.1'
    implementation 'io.michaelrocks:libphonenumber-android:8.13.35'
    implementation 'com.github.joielechong:countrycodepicker:2.4.2'
}
