// Top-level build file where you can add configuration options common to all sub-projects/modules.
buildscript {
    ext.kotlin_version = "1.7.20"
    repositories {
        google()
        jcenter()
        gradlePluginPortal()
        mavenCentral()
//        maven { url 'https://jitpack.io' }
//        maven {url "https://plugins.gradle.org/m2/"}
        configurations.all {
            resolutionStrategy {
//                dependencySubstitution {
//                    substitute module('net.sf.proguard:proguard-gradle') with module('com.guardsquare:proguard-gradle:7.0.1')
//                }
            }
        }
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.2.2'
        classpath 'com.google.dagger:hilt-android-gradle-plugin:2.45'
        classpath "androidx.navigation:navigation-safe-args-gradle-plugin:2.7.7"
        classpath 'com.google.gms:google-services:4.4.2'
        classpath 'com.google.firebase:firebase-crashlytics-gradle:3.0.2'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.21"
        classpath "org.jetbrains.kotlin:kotlin-serialization:1.9.10"
        classpath "org.jetbrains.kotlin:kotlin-annotation-processing-gradle:1.5.10"
        classpath 'com.jakewharton:butterknife-gradle-plugin:10.2.3'
//        classpath 'com.jfrog.bintray.gradle:gradle-bintray-plugin:1.8.0'
//        id("com.android.tools.build:gradle") version "8.2.2" apply false
//        id("com.google.dagger:hilt-android-gradle-plugin") version "2.45" apply false
//        id("androidx.navigation:navigation-safe-args-gradle-plugin") version "2.7.7" apply false
//        id("com.google.firebase:firebase-crashlytics-gradle") version "3.0.2" apply false
//        id("org.jetbrains.kotlin:kotlin-gradle-plugin") version "1.7.20" apply false
//        id("org.jetbrains.kotlin:kotlin-serialization") version "1.9.0" apply false
//        id("org.jetbrains.kotlin:kotlin-annotation-processing-gradle") version "1.5.10" apply false
//        id("com.jfrog.bintray.gradle:gradle-bintray-plugin") version "1.8.0" apply false
    }
}
//apply plugin: 'com.jfrog.bintray'
allprojects {
    repositories {
        google()
        mavenCentral()
        maven{
            url "https://github.com/omadahealth/omada-nexus/raw/master/release"
        }
        maven { url 'https://jitpack.io' }
        maven { url 'https://plugins.gradle.org/m2' }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}